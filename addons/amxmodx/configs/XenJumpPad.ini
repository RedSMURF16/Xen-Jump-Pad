#==============================================#
# Xen Jump Pad by RedSMURF: Configuration file #
#==============================================#

# To add a new pad, follow the example below
# [Pad Name]
# PAD_FLAGS                 = a - Players Only
# PAD_TEAM                  = 0 - None              1 - Terrorist           2 - Counter-Terrorist    3 - Both

# PAD_RADIUS                = Trigger radius for launching players
# PAD_STRENGTH              = Launch strength range (min - max)
# PAD_COOLDOWN              = Delay in seconds between consecutive launches on the same player
# PAD_FRAMERATE             = Pad's animation speed

# To make a pad available in the menu, you must define at least its name like this [Pad]
# Pad model and sound are configuration defaults; runtime state is stored per pad

[Main Settings]
SETTING_DEFAULT_MODEL           = models/XenJumpPad/pad_large.mdl
SETTING_DEFAULT_FLAGS           = 0
SETTING_DEFAULT_TEAM            = 3

SETTING_DEFAULT_FRAMERATE       = 1.0
SETTING_DEFAULT_RADIUS          = 50.0
SETTING_DEFAULT_RADIUS_OFFSET   = 22.5
SETTING_DEFAULT_STRENGTH        = 600.0 750.0
SETTING_DEFAULT_COOLDOWN        = 2.0 3.0

SETTING_MODEL_SMALL             = models/XenJumpPad/pad_small.mdl
SETTING_MODEL_MEDIUM            = models/XenJumpPad/pad_medium.mdl
SETTING_MODEL_LARGE             = models/XenJumpPad/pad_large.mdl
SETTING_MINS_SMALL              = -40.0 -40.0 -7.5
SETTING_MAXS_SMALL              = 40.0 40.0 3.0
SETTING_MINS_MEDIUM             = -50 -50 -9.5
SETTING_MAXS_MEDIUM             = 50 50 3.5
SETTING_MINS_LARGE              = -65 -65 -12.0
SETTING_MAXS_LARGE              = 65 65 4.0
SETTING_TRIGGER_RADIUS          = 42.5 50.0 65.0
SETTING_TRIGGER_OFFSET          = 20.0 22.5 25.0
SETTING_SOUND_JUMP              = doors/aliendoor3.wav

SETTING_PAD_LOAD                = 1             # Whether to load saved pads data of the current map
SETTING_PAD_CHECK               = 10.0          # Maximum selection distance when checking nearby pads
SETTING_PAD_TASK                = 0.1           # Time interval in seconds to check for pads and apply their effects
SETTING_OFFSET_BASE             = 120.0         # Default forward offset when previewing pad placement
SETTING_OFFSET                  = 65.0 900.0    # Default minimum and maximum offset from the player to the pad (MIN MAX)
SETTING_OFFSET_STEP             = 10.0          # Step size when scrolling to move pad forward/backward
SETTING_GHOST_ALPHA             = 120           # Transparency level of the ghost preview model (0 - 255)
SETTING_ROTATION_STEP           = 22.5          # Step size when rotating the fan

[Jump Small]
PAD_STRENGTH        = 370.0 420.0

[Small CoolDown]
PAD_COOLDOWN        = 1.0 1.0

[Jump Straight to Xen]
PAD_STRENGTH        = 1700.0 2200.0






